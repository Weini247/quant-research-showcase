<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Research logic: from measurement to a justified decision</title><desc id="desc">A conceptual process diagram, with no market data. Define a question, check measurement, compare fixed forecasts, test decision identification, and continue or stop. Feedback returns to the question.</desc>
<rect width="1000" height="440" rx="20" fill="#102226"/>
<g fill="#dcebe5" font-family="system-ui,sans-serif"><text x="44" y="54" font-size="15" letter-spacing="2">CONCEPTUAL RESEARCH CYCLE</text><text x="44" y="90" font-size="28">A forecast is an input. A decision needs evidence.</text></g>
<g fill="#173538" stroke="#6aa695" stroke-width="1.5"><rect x="44" y="140" width="168" height="130" rx="12"/><rect x="230" y="140" width="168" height="130" rx="12"/><rect x="416" y="140" width="168" height="130" rx="12"/><rect x="602" y="140" width="168" height="130" rx="12"/><rect x="788" y="140" width="168" height="130" rx="12"/></g>
<g fill="#e9f3ed" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle"><text x="128" y="188">Question</text><text x="314" y="188">Measurement</text><text x="500" y="188">Comparison</text><text x="686" y="188">Identification</text><text x="872" y="188">Decision</text></g>
<g fill="#b0c9c0" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle"><text x="128" y="220">What is the claim?</text><text x="314" y="220">What was knowable?</text><text x="500" y="220">Do baselines hold?</text><text x="686" y="220">Is the claim supported?</text><text x="872" y="220">Continue or stop</text></g>
<g stroke="#9bdcca" fill="none" stroke-width="2"><path d="M212 205h18m168 0h18m168 0h18m168 0h18"/><path d="M872 285v52H128v-52"/></g>
<g fill="#9bdcca" font-family="system-ui,sans-serif"><text x="318" y="365" font-size="16">Evidence can justify simpler methods, abstention or a new question.</text><text x="44" y="409" font-size="13">ABSTRACT WORKFLOW · NOT A DEPLOYMENT DIAGRAM · NO EMPIRICAL VALUES</text></g></svg>
