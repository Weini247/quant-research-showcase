name: Public research verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact public file manifest
        run: python verify_public_manifest.py
      - name: Run aggregate consistency tests
        run: python -m unittest discover -s research/fx-development -p 'test_*.py' -v
      - name: Run synthetic accounting tests
        run: python -m unittest discover -s examples/synthetic_accounting -p 'test_*.py' -v
      - name: Run fictional demonstration
        run: python examples/synthetic_accounting/demo.py
